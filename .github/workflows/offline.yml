name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -B -I tools/check_release.py
      - run: python3 -B -I skills/antigravity-preflight/scripts/test_manual_citations.py
      - run: python3 -B -I tools/qualify_offline.py "$RUNNER_TEMP/antigravity-offline"
