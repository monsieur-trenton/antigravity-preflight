name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -B -I tools/check_release.py
      - run: python3 -B -I tools/test_release_assets.py
      - run: python3 -B -I tools/test_demonstrated_utility.py
      - run: python3 -B -I skills/antigravity-preflight/scripts/test_manual_citations.py
      - run: python3 -B -I benchmarks/exploratory-plan-audit/test_evaluate.py
      - run: python3 -B -I benchmarks/fault-injection/run_faults.py --check
      - run: python3 -B -I benchmarks/plots/test_make_figures.py
      - run: python3 -B -I benchmarks/plots/make_figures.py --check
      - run: python3 -B -I benchmarks/counterfactual-pairs/build_corpus.py --check
      - run: python3 -B -I benchmarks/counterfactual-pairs/test_score.py
      - run: python3 -B -I benchmarks/counterfactual-pairs/test_run_pilot.py
      - run: python3 -B -I tools/qualify_offline.py "$RUNNER_TEMP/antigravity-offline"
      - run: python3 -B -I tools/qualify_argon_offline.py "$RUNNER_TEMP/antigravity-argon-offline"
