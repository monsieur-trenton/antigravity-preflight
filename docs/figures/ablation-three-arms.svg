<rect x="496.5" y="506.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="606" y="516" class="small muted" text-anchor="start">pairs lost to stops: 3 bare, 1 defined</text>
<text x="24" y="540" class="lab" text-anchor="start">Migration order</text>
<line x1="334" y1="536" x2="586" y2="536" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="536" r="6.5" fill="var(--skill)" stroke="var(--surface)" stroke-width="1.5"/>
<polygon points="334,528.5 341.5,536 334,543.5 326.5,536" fill="var(--bare)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="580.5" y="530.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
