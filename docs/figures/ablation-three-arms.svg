<line x1="586" y1="680" x2="586" y2="680" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="680" r="6.5" fill="var(--skill)" stroke="var(--surface)" stroke-width="1.5"/>
<polygon points="586,672.5 593.5,680 586,687.5 578.5,680" fill="var(--bare)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="580.5" y="674.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
<circle cx="32" cy="712" r="6.5" fill="var(--skill)"/>
<text x="48" y="716" class="small" text-anchor="start">Skill-style</text>
<polygon points="156.6,704.5 164.1,712 156.6,719.5 149.1,712" fill="var(--bare)"/>
<text x="172.6" y="716" class="small" text-anchor="start">Bare</text>
<rect x="229.5" y="706.5" width="11" height="11" fill="var(--defined)"/>
<text x="251.0" y="716" class="small" text-anchor="start">Bare + defined verdicts</text>
<text x="24" y="746" class="small" text-anchor="start">Primary (preregistered): skill-style 40/40, defined 35/39, bare 21/37 pairs.</text>
<text x="24" y="764" class="small" text-anchor="start">Defined against bare: 0 units favour bare, 12 favour defined (p = 0.0005). Defined against skill-style: 4 favour skill-style, 0 favour defined (p = 0.125).</text>
<text x="24" y="782" class="small" text-anchor="start">All 4 units still favouring the skill-style arm are in one family (Runtime budget evidence), the preregistered limit: a hedged sound plan leaves nothing to order.</text>
<text x="24" y="800" class="small" text-anchor="start">Verdict follows finding: skill-style 36/36, defined 35/35, bare 19/34.</text>
<text x="24" y="818" class="small" text-anchor="start">Sound plans were still hedged: clean 8 of 40 (defined), 24 of 40 (skill-style). None was blocked in any arm.</text>
<text x="24" y="836" class="small muted" text-anchor="start">Preregistered label: partly closes the gap. A bundle test: other differences from the skill-style arm remain.</text>
</svg>
