<line x1="418" y1="560" x2="586" y2="560" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="560" r="6.5" fill="var(--skill)" stroke="var(--surface)" stroke-width="1.5"/>
<polygon points="418,552.5 425.5,560 418,567.5 410.5,560" fill="var(--bare)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="580.5" y="554.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="588" class="lab" text-anchor="start">Unit mismatch</text>
<line x1="418" y1="584" x2="586" y2="584" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="584" r="6.5" fill="var(--skill)" stroke="var(--surface)" stroke-width="1.5"/>
<polygon points="418,576.5 425.5,584 418,591.5 410.5,584" fill="var(--bare)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="580.5" y="578.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
