<text x="502" y="442" class="small muted" text-anchor="middle">3</text>
<line x1="586" y1="448" x2="586" y2="692" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="586" y="442" class="small muted" text-anchor="middle">4</text>
