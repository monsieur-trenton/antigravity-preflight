<circle cx="586" cy="656" r="6.5" fill="var(--skill)" stroke="var(--surface)" stroke-width="1.5"/>
<polygon points="586,648.5 593.5,656 586,663.5 578.5,656" fill="var(--bare)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="580.5" y="650.5" width="11" height="11" fill="var(--defined)" stroke="var(--surface)" stroke-width="1.5"/>
