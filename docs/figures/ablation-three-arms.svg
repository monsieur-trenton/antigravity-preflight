<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 872" width="900" height="872" role="img" aria-labelledby="t d">
<title id="t">Three arms on corpus v2: skill-style, bare, and bare with defined verdicts</title><desc id="d">Verdict mix and per-family pair discrimination: 40 of 40 (skill-style), 35 of 39 (defined) and 21 of 37 (bare) pairs ordered.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#dcdbd6; --accent:#2a78d6;
  --on-accent:#ffffff; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#ecebe7; --tile:#f3f2ee; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3a37; --accent:#3987e5;
    --on-accent:#0b0b0b; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#2a2a28; --tile:#232321; }
}
text { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { fill:var(--ink2); }
.title { font-size:20px; font-weight:600; }
.sub { font-size:13px; }
.lab { font-size:13px; }
.small { font-size:11.5px; }
.big { font-size:30px; font-weight:650; }
.head { font-size:12px; font-weight:600; }

svg { --skill:#2a78d6; --bare:#eb6834; --defined:#1baf7a; }
@media (prefers-color-scheme: dark) { svg { --skill:#3987e5; --bare:#d95926; --defined:#199e70; } }
</style>
<rect width="900" height="872" rx="10" fill="var(--surface)"/>
<text x="24" y="36" class="title" text-anchor="start">Does defining the verdicts close the gap? Three arms, same 40 plans</text>
<text x="24" y="58" class="sub muted" text-anchor="start">claude-opus-5-5 through the Claude CLI, 2 trials per arm. The skill-style and bare arms were run earlier, not concurrently.</text>
<text x="24" y="78" class="sub muted" text-anchor="start">The bare + defined arm is the bare prompt plus one five-line block saying what GO, GO_WITH_CHANGES and NO_GO mean.</text>
<text x="24" y="116" class="lab" text-anchor="start" font-weight="600">A. Verdicts given</text>
<text x="24" y="149" class="head" text-anchor="start">Sound plans</text>
<text x="36" y="173" class="small" text-anchor="start">Skill-style (n=40)</text>
<rect x="250.0" y="156" width="288.0" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<text x="394.0" y="171" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Clean 24</text>
<rect x="538.0" y="156" width="192.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="634.0" y="171" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 16</text>
<text x="36" y="201" class="small" text-anchor="start">Bare (n=39)</text>
<rect x="250.0" y="184" width="86.2" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<text x="293.1" y="199" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Clean 7</text>
<rect x="336.2" y="184" width="393.8" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="533.1" y="199" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 32</text>
<text x="36" y="229" class="small" text-anchor="start">Bare + defined verdicts (n=40)</text>
<rect x="250.0" y="212" width="96.0" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<text x="298.0" y="227" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Clean 8</text>
<rect x="346.0" y="212" width="384.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="538.0" y="227" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 32</text>
<text x="24" y="261" class="head" text-anchor="start">Defect twins</text>
<text x="36" y="285" class="small" text-anchor="start">Skill-style (n=36)</text>
<rect x="250.0" y="268" width="480.0" height="22" fill="#184f95" stroke="var(--surface)" stroke-width="2"/>
<text x="490.0" y="283" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Blockers 36</text>
<text x="36" y="313" class="small" text-anchor="start">Bare (n=34)</text>
<rect x="250.0" y="296" width="211.8" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="355.9" y="311" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 15</text>
<rect x="461.8" y="296" width="268.2" height="22" fill="#184f95" stroke="var(--surface)" stroke-width="2"/>
<text x="595.9" y="311" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Blockers 19</text>
<text x="36" y="341" class="small" text-anchor="start">Bare + defined verdicts (n=35)</text>
<rect x="250.0" y="324" width="480.0" height="22" fill="#184f95" stroke="var(--surface)" stroke-width="2"/>
<text x="490.0" y="339" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Blockers 35</text>
<rect x="250" y="358" width="22" height="14" rx="3" fill="#cde2fb"/>
<text x="280" y="369" class="small" text-anchor="start">Clean (GO)</text>
<rect x="366.0" y="358" width="22" height="14" rx="3" fill="#6da7ec"/>
<text x="396.0" y="369" class="small" text-anchor="start">Changes (GO_WITH_CHANGES)</text>
<rect x="581.0" y="358" width="22" height="14" rx="3" fill="#184f95"/>
<text x="611.0" y="369" class="small" text-anchor="start">Blockers (NO_GO)</text>
<text x="24" y="402" class="lab" text-anchor="start" font-weight="600">B. Pairs where the changed twin was judged more severely than its sound twin</text>
<text x="24" y="420" class="small muted" text-anchor="start">Out of 4 per family (2 wordings x 2 trials). A dashed line spans pairs that a stop removed.</text>
<line x1="250" y1="448" x2="250" y2="692" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="250" y="442" class="small muted" text-anchor="middle">0</text>
