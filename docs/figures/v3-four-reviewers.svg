<rect width="900" height="544" rx="10" fill="var(--surface)"/>
<text x="24" y="36" class="title" text-anchor="start">Corpus v3: five reviewers, verdict mix per kind of case</text>
<text x="24" y="58" class="sub muted" text-anchor="start">Claude Opus 5.5 via the Claude CLI (four prompt arms) and Gemini 3.8 Flash High via the native route; 64 cases, 2 trials each.</text>
<text x="24" y="78" class="sub muted" text-anchor="start">The right verdict is Clean for a sound plan, Blockers for a defect twin and Changes for an evidence-gap twin (outlined).</text>
