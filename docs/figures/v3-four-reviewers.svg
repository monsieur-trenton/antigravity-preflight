<text x="24" y="466" class="small" text-anchor="start">Counts are observations over two trials. Gemini had 1 runtime stop (a sound plan), removed from every denominator.</text>
<text x="24" y="484" class="small" text-anchor="start">Gap twins judged Blockers: skill-style 8, defined 26, defined+sentence 21, skill+sentence 14 of 32; Clean: 1 (defined+sentence).</text>
<text x="24" y="502" class="small" text-anchor="start">Sound plans hedged: Claude skill-style 30 of 64, with the sentence 1; Gemini 2 of 63.</text>
<text x="24" y="520" class="small muted" text-anchor="start">Different routes, wrappers and days: Claude against Gemini is a difference as run, not between models.</text>
