<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1264" width="900" height="1264" role="img" aria-labelledby="t d">
<title id="t">Four arms on corpus v2: the optional-suggestions sentence</title><desc id="d">Verdict mix by arm for sound plans, defect twins and uncertainty twins, and pairs ordered per family: the sentence made 40 of 40 sound plans clean and kept every defect twin blocked, but 3 of 4 uncertainty-twin observations were judged Clean.</desc>
