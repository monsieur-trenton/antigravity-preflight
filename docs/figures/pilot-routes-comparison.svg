<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="t d">
<title id="t">Corpus v1 on two reviewer routes</title><desc id="d">Verdict mix and pairs ordered per family for Claude Opus 5.5 and Gemini 3.8 Flash High on the same 24 plans; verdicts agree in 36 of 48 observations.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#dcdbd6; --accent:#2a78d6;
  --on-accent:#ffffff; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#ecebe7; --tile:#f3f2ee; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3a37; --accent:#3987e5;
    --on-accent:#0b0b0b; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#2a2a28; --tile:#232321; }
}
text { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { fill:var(--ink2); }
.title { font-size:20px; font-weight:600; }
.sub { font-size:13px; }
.lab { font-size:13px; }
.small { font-size:11.5px; }
.big { font-size:30px; font-weight:650; }
.head { font-size:12px; font-weight:600; }

svg { --claude:#2a78d6; --flash:#8a5fd6; }
@media (prefers-color-scheme: dark) { svg { --claude:#3987e5; --flash:#a07ae6; } }
</style>
<rect width="900" height="900" rx="10" fill="var(--surface)"/>
<text x="24" y="36" class="title" text-anchor="start">Same 24 plans, two reviewers: Claude Opus 5.5 and Gemini 3.8 Flash High</text>
<text x="24" y="58" class="sub muted" text-anchor="start">Corpus v1, 2 trials each: Claude via claude-cli, Gemini via the native flash-high route; run at different times.</text>
<text x="24" y="78" class="sub muted" text-anchor="start">Gemini's four format stops (label S01:3 for line 3) are re-read as line 3; as-run numbers are in the write-up.</text>
<text x="24" y="116" class="lab" text-anchor="start" font-weight="600">A. Verdicts given</text>
<text x="24" y="149" class="head" text-anchor="start">Sound plans</text>
<text x="36" y="173" class="small" text-anchor="start">Claude Opus 5.5 (n=24)</text>
<rect x="250.0" y="156" width="340.0" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<text x="420.0" y="171" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Clean 17</text>
<rect x="590.0" y="156" width="140.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="660.0" y="171" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 7</text>
<text x="36" y="201" class="small" text-anchor="start">Gemini 3.8 Flash High (n=24)</text>
<rect x="250.0" y="184" width="480.0" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<text x="490.0" y="199" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Clean 24</text>
<text x="24" y="233" class="head" text-anchor="start">Defect twins</text>
<text x="36" y="257" class="small" text-anchor="start">Claude Opus 5.5 (n=20)</text>
<rect x="250.0" y="240" width="96.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="298.0" y="255" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 4</text>
<rect x="346.0" y="240" width="384.0" height="22" fill="#184f95" stroke="var(--surface)" stroke-width="2"/>
<text x="538.0" y="255" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Blockers 16</text>
<text x="36" y="285" class="small" text-anchor="start">Gemini 3.8 Flash High (n=20)</text>
<rect x="250.0" y="268" width="24.0" height="22" fill="#cde2fb" stroke="var(--surface)" stroke-width="2"/>
<rect x="274.0" y="268" width="168.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="358.0" y="283" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 7</text>
<rect x="442.0" y="268" width="288.0" height="22" fill="#184f95" stroke="var(--surface)" stroke-width="2"/>
<text x="586.0" y="283" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Blockers 12</text>
<text x="24" y="317" class="head" text-anchor="start">Uncertainty twin (runtime budget)</text>
<text x="36" y="341" class="small" text-anchor="start">Claude Opus 5.5 (n=4)</text>
<rect x="250.0" y="324" width="480.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="490.0" y="339" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 4</text>
<text x="36" y="369" class="small" text-anchor="start">Gemini 3.8 Flash High (n=4)</text>
<rect x="250.0" y="352" width="480.0" height="22" fill="#6da7ec" stroke="var(--surface)" stroke-width="2"/>
<text x="490.0" y="367" class="small" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Changes 4</text>
<rect x="250" y="386" width="22" height="14" rx="3" fill="#cde2fb"/>
<text x="280" y="397" class="small" text-anchor="start">Clean (GO)</text>
<rect x="366.0" y="386" width="22" height="14" rx="3" fill="#6da7ec"/>
<text x="396.0" y="397" class="small" text-anchor="start">Changes (GO_WITH_CHANGES)</text>
<rect x="581.0" y="386" width="22" height="14" rx="3" fill="#184f95"/>
<text x="611.0" y="397" class="small" text-anchor="start">Blockers (NO_GO)</text>
<text x="24" y="430" class="lab" text-anchor="start" font-weight="600">B. Pairs where the changed twin was judged more severely than its sound twin</text>
<text x="24" y="448" class="small muted" text-anchor="start">Out of 4 per family (2 wordings x 2 trials); a line joins the lowest and highest arm. Stops can remove pairs.</text>
<line x1="250" y1="476" x2="250" y2="720" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="250" y="470" class="small muted" text-anchor="middle">0</text>
<line x1="334" y1="476" x2="334" y2="720" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="334" y="470" class="small muted" text-anchor="middle">1</text>
<line x1="418" y1="476" x2="418" y2="720" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="418" y="470" class="small muted" text-anchor="middle">2</text>
<line x1="502" y1="476" x2="502" y2="720" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="502" y="470" class="small muted" text-anchor="middle">3</text>
<line x1="586" y1="476" x2="586" y2="720" stroke="var(--grid)" stroke-opacity="0.7"/>
<text x="586" y="470" class="small muted" text-anchor="middle">4</text>
<text x="24" y="496" class="lab" text-anchor="start">Output byte limit</text>
<line x1="250" y1="492" x2="502" y2="492" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="250" cy="488.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="497.71" y="491.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="536" class="lab" text-anchor="start">Absent vs null</text>
<line x1="586" y1="532" x2="586" y2="532" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="528.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="581.71" y="531.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="576" class="lab" text-anchor="start">Caller / callee</text>
<line x1="586" y1="572" x2="586" y2="572" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="568.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="581.71" y="571.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="616" class="lab" text-anchor="start">Ownership / authorization</text>
<line x1="586" y1="612" x2="586" y2="612" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="608.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="581.71" y="611.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="656" class="lab" text-anchor="start">Required coverage</text>
<line x1="586" y1="652" x2="586" y2="652" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="648.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="581.71" y="651.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<text x="24" y="696" class="lab" text-anchor="start">Runtime budget evidence</text>
<line x1="586" y1="692" x2="586" y2="692" stroke="var(--ink2)" stroke-width="2"/>
<circle cx="586" cy="688.0" r="5.1" fill="var(--claude)" stroke="var(--surface)" stroke-width="1.5"/>
<rect x="581.71" y="691.71" width="8.58" height="8.58" fill="var(--flash)" stroke="var(--surface)" stroke-width="1.5"/>
<circle cx="32" cy="740" r="6.5" fill="var(--claude)"/>
<text x="48" y="744" class="small" text-anchor="start">Claude Opus 5.5</text>
<rect x="177.5" y="734.5" width="11" height="11" fill="var(--flash)"/>
<text x="199.0" y="744" class="small" text-anchor="start">Gemini 3.8 Flash High</text>
<text x="24" y="774" class="small" text-anchor="start">Pairs ordered (twin judged more severely than its sound plan), trials 1 and 2: Claude 10/12 and 10/12, Gemini 12/12 and 11/12.</text>
<text x="24" y="792" class="small" text-anchor="start">Without the defective Output byte limit family: Claude 10/10 and 10/10, Gemini 10/10 and 10/10.</text>
<text x="24" y="810" class="small" text-anchor="start">Strict pairs (sound plan Clean and twin right): Claude 9/12 and 8/12, Gemini 8/12 and 8/12.</text>
<text x="24" y="828" class="small" text-anchor="start">Gemini hedged 0 of 24 sound plans, Claude 7 of 24. On required coverage Gemini wrote Changes where Claude wrote Blockers.</text>
<text x="24" y="846" class="small muted" text-anchor="start">Verdicts agree in 36 of 48. Gemini's 4 format stops are re-read (documented rule); its model is requested, not attested.</text>
<text x="24" y="864" class="small muted" text-anchor="start">Different routes and times, one corpus with one flawed family; nothing here is a general accuracy rate.</text>
</svg>
