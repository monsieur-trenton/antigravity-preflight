<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 962" width="900" height="962" role="img" aria-labelledby="t d">
<title id="t">Fault injection against the citation checker</title><desc id="d">13 of 13 mechanical faults stopped; 2 semantic faults pass through to manual review; 4 checks not exercised.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#dcdbd6; --accent:#2a78d6;
  --on-accent:#ffffff; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#ecebe7; --tile:#f3f2ee; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3a37; --accent:#3987e5;
    --on-accent:#0b0b0b; --warn:#fab219; --on-warn:#0b0b0b; --neutral:#2a2a28; --tile:#232321; }
}
text { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
.mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { fill:var(--ink2); }
.title { font-size:20px; font-weight:600; }
.sub { font-size:13px; }
.lab { font-size:13px; }
.small { font-size:11.5px; }
.big { font-size:30px; font-weight:650; }
.head { font-size:12px; font-weight:600; }
</style>
<rect width="900" height="962" rx="10" fill="var(--surface)"/>
<text x="24" y="36" class="title" text-anchor="start">Fault injection: what the citation checker catches, and what it cannot</text>
<text x="24" y="58" class="sub muted" text-anchor="start">13 of 13 mechanical faults stopped with the expected reason · 2 of 2 semantic faults pass through · 4 checks not exercised</text>
<text x="24" y="78" class="sub muted" text-anchor="start">Each row is a single fault applied to a valid baseline, run through the real manual_citations.py. No model or provider is called.</text>
<text x="476.0" y="126" class="head" text-anchor="middle">Pin &amp;</text>
<text x="476.0" y="141" class="head" text-anchor="middle">path</text>
<text x="540.0" y="126" class="head" text-anchor="middle">Strict</text>
<text x="540.0" y="141" class="head" text-anchor="middle">parsing</text>
<text x="604.0" y="126" class="head" text-anchor="middle">Ledger</text>
<text x="604.0" y="141" class="head" text-anchor="middle">schema</text>
<text x="668.0" y="126" class="head" text-anchor="middle">Line &amp;</text>
<text x="668.0" y="141" class="head" text-anchor="middle">quote</text>
<text x="744" y="126" class="head" text-anchor="middle">Passes</text>
<text x="744" y="141" class="head" text-anchor="middle">script</text>
<text x="832" y="126" class="head" text-anchor="middle">Not</text>
<text x="832" y="141" class="head" text-anchor="middle">exercised</text>
